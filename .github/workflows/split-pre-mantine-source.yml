name: Split pre-Mantine source

on:
  push:
    branches:
      - main
    paths:
      - "agent_space/patches/20260906-036.md"

permissions:
  contents: write

concurrency:
  group: split-pre-mantine-source
  cancel-in-progress: false

jobs:
  split:
    if: github.event.head_commit.message == 'Prepare pre-Mantine source split'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Split application and Plotly scripts without rewriting bytes
        shell: bash
        run: |
          set -euo pipefail
          cp Fast-figure.html /tmp/Fast-figure-before-split.html
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path("Fast-figure.html")
          payload = html_path.read_bytes()
          pattern = re.compile(br"<script(?P<attrs>[^>]*)>(?P<body>[\s\S]*?)</script>", re.I)
          matches = list(pattern.finditer(payload))
          if not matches:
              raise SystemExit("No inline script tags found")

          app_matches = [m for m in matches if b"PACKAGE_FORMAT_VERSION" in m.group("body")]
          if len(app_matches) != 1:
              raise SystemExit(f"Expected one application script, found {len(app_matches)}")
          app_match = app_matches[0]

          candidates = [m for m in matches if m is not app_match and len(m.group("body")) > 1_000_000]
          if len(candidates) != 1:
              raise SystemExit(
                  "Expected one non-application inline script larger than 1 MB for Plotly, "
                  f"found {len(candidates)}; script sizes={[len(m.group('body')) for m in matches]}"
              )
          plotly_match = candidates[0]

          for label, match in (("Plotly", plotly_match), ("application", app_match)):
              if match.group("attrs").strip():
                  raise SystemExit(f"{label} script has attributes and requires explicit review: {match.group('attrs')!r}")

          if plotly_match.start() > app_match.start():
              raise SystemExit("Plotly script is not before the application script")

          Path("vendor").mkdir(exist_ok=True)
          Path("vendor/plotly.min.js").write_bytes(plotly_match.group("body"))
          Path("fast-figure.js").write_bytes(app_match.group("body"))

          replacements = [
              (plotly_match.start(), plotly_match.end(), b'<script src="./vendor/plotly.min.js"></script>'),
              (app_match.start(), app_match.end(), b'<script src="./fast-figure.js"></script>'),
          ]
          output = payload
          for start, end, replacement in sorted(replacements, reverse=True):
              output = output[:start] + replacement + output[end:]
          html_path.write_bytes(output)

          print(
              "split scripts:",
              f"plotly_bytes={len(plotly_match.group('body'))}",
              f"app_bytes={len(app_match.group('body'))}",
              f"inline_scripts_before={len(matches)}",
          )
          PY

      - name: Add byte-preserving portable builder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat > scripts/build-portable.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import argparse
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          DEFAULT_OUTPUT = ROOT / "dist" / "Fast-figure.html"
          SCRIPTS = (
              (
                  b'<script src="./vendor/plotly.min.js"></script>',
                  ROOT / "vendor" / "plotly.min.js",
              ),
              (
                  b'<script src="./fast-figure.js"></script>',
                  ROOT / "fast-figure.js",
              ),
          )


          def build(output: Path) -> None:
              portable = (ROOT / "Fast-figure.html").read_bytes()
              for tag, source in SCRIPTS:
                  if portable.count(tag) != 1:
                      raise RuntimeError(f"expected exactly one external script tag: {tag!r}")
                  if not source.is_file():
                      raise FileNotFoundError(source)
                  portable = portable.replace(
                      tag,
                      b"<script>" + source.read_bytes() + b"</script>",
                      1,
                  )
              for tag, _ in SCRIPTS:
                  if tag in portable:
                      raise RuntimeError(f"external script tag remains: {tag!r}")
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(portable)


          def parse_args() -> argparse.Namespace:
              parser = argparse.ArgumentParser(
                  description="Build the byte-equivalent single-file Fast Figure HTML from split source."
              )
              parser.add_argument("--output", type=Path, default=DEFAULT_OUTPUT)
              return parser.parse_args()


          if __name__ == "__main__":
              args = parse_args()
              build(args.output.resolve())
          PY
          chmod +x scripts/build-portable.py

      - name: Validate split and exact portable reconstruction
        shell: bash
        run: |
          set -euo pipefail
          node --check fast-figure.js
          python scripts/build-portable.py --output /tmp/Fast-figure-rebuilt.html
          cmp --silent /tmp/Fast-figure-before-split.html /tmp/Fast-figure-rebuilt.html || {
            echo "Portable reconstruction is not byte-identical to the pre-split HTML." >&2
            cmp -l /tmp/Fast-figure-before-split.html /tmp/Fast-figure-rebuilt.html | head -20 >&2 || true
            exit 1
          }
          grep -F '<script src="./vendor/plotly.min.js"></script>' Fast-figure.html >/dev/null
          grep -F '<script src="./fast-figure.js"></script>' Fast-figure.html >/dev/null
          git diff --check

      - name: Record exact diff patch
        shell: bash
        run: |
          set -euo pipefail
          git add -N fast-figure.js vendor/plotly.min.js scripts/build-portable.py
          git diff -- Fast-figure.html fast-figure.js vendor/plotly.min.js scripts/build-portable.py > agent_space/patches/20260906-036.patch
          test -s agent_space/patches/20260906-036.patch
          git apply --check --reverse agent_space/patches/20260906-036.patch

      - name: Commit split source and patch record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Fast-figure.html fast-figure.js vendor/plotly.min.js scripts/build-portable.py agent_space/patches/20260906-036.patch agent_space/patches/20260906-036.md
          git commit -m "Apply agent patch 20260906-036"
          git push
