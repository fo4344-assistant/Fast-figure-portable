name: Development layer versions

on:
  push:
    branches: [main]
    paths:
      - 'sourcescript/**'
      - 'verification/**'
      - 'pseudocode/**'
      - 'development-versions.json'
      - 'sourcecode/Fast-figure.html'
      - 'sourcecode/fast-figure.js'
      - 'sourcecode/fast-figure-ui.js'
      - 'scripts/build-portable.py'
      - 'scripts/check-development-layer-versions.py'
      - 'agent_space/AGENT.md'
      - 'agent_space/policies/development-policy.md'
      - 'agent_space/reviews/**'
      - '.github/workflows/development-layer-version.yml'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Optional baseline commit for cumulative revision and patch-record validation'
        required: false
        type: string

permissions:
  contents: read

jobs:
  version-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate development layer versions
        env:
          BASE_SHA: ${{ github.event.inputs.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check-development-layer-versions.py --base "$BASE_SHA"
          else
            python scripts/check-development-layer-versions.py
          fi
